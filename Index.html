<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Monitor Territorial Tolima 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23761C33' stroke='%23CBA135' stroke-width='2'/%3E%3Cpath d='M16 6c-3.3 0-6 2.7-6 6 0 4.5 6 12 6 12s6-7.5 6-12c0-3.3-2.7-6-6-6zm0 8.5c-1.4 0-2.5-1.1-2.5-2.5s1.1-2.5 2.5-2.5 2.5 1.1 2.5 2.5-1.1 2.5-2.5 2.5z' fill='%23CBA135'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
    <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bgLayer"></div>
    <div id="loader">
        <div class="spinner"></div>
        <div id="loadingText" style="margin-top:15px;">Iniciando Sistema...</div>
    </div>
    <div id="printContainer"></div>

    <div class="main-layout">
        <section class="dashboard-panel">
            <div id="map"></div>

            <aside id="sidebar">
                <div class="brand-header">
                    <img id="mainLogo" src="https://tolima.gov.co/images/Tablero_planeacion_2026.jpg" alt="Tolima Logo">
                </div>
                <div class="controls-area">
                    <div class="kpi-card">
                        <div class="kpi-title" id="kpiLabel">Inversión Total Departamental</div>
                        <div class="kpi-value" id="kpiRP">$ 0</div>
                    </div>
                    <fieldset class="filter-group">
                        <legend>Vigencia de Inversión</legend>
                        <div class="vigencias-btn-group" id="vigenciasGroup" role="group">
                            <button id="btnVigencia2024" name="btnVigencia2024" type="button" class="btn-vigencia" onclick="cambiarVigencia('2024')">2024</button>
                            <button id="btnVigencia2025" name="btnVigencia2025" type="button" class="btn-vigencia active" onclick="cambiarVigencia('2025')">2025</button>
                            <button id="btnVigencia2026" name="btnVigencia2026" type="button" class="btn-vigencia" onclick="cambiarVigencia('2026')">2026</button>
                            <button id="btnVigencia2027" name="btnVigencia2027" type="button" class="btn-vigencia" onclick="cambiarVigencia('2027')">2027</button>
                        </div>
                    </fieldset>
                    <div class="filter-group">
                        <label for="fuenteFilter">Fuente de Financiación</label>
                        <select id="fuenteFilter" name="fuenteFilter">
                            <option value="">🌐 Todas las Fuentes</option>
                            <option value="propios">Recursos Propios</option>
                            <option value="sgr">Regalías (SGR)</option>
                            <option value="sgp">Participaciones (SGP)</option>
                            <option value="credito">Crédito</option>
                            <option value="cofin">Cofinanciación</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="subFilter">Filtrar por Subregión</label>
                        <select id="subFilter" name="subFilter">
                            <option value="">🗺️ Visión Global del Tolima</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="muniFilter">Seleccionar Municipio</label>
                        <select id="muniFilter" name="muniFilter">
                            <option value="">🏛️ Todos los Municipios</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="secFilter">Filtrar por Dependencia o Entidad</label>
                        <select id="secFilter" name="secFilter">
                            <option value="">🏢 Todas las Dependencias o Entidades</option>
                        </select>
                    </div>
                    <div class="map-toggles-container">
                        <button id="btnSubmap" name="btnSubmap" type="button" class="btn-map-toggle">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            </svg>
                            <span>Subregiones</span>
                        </button>
                        <button id="btnHeatmap" name="btnHeatmap" type="button" class="btn-map-toggle">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                                <line x1="8" y1="2" x2="8" y2="18"></line>
                                <line x1="16" y1="6" x2="16" y2="22"></line>
                            </svg>
                            <span>Calor</span>
                        </button>
                    </div>
                </div>
            </aside>

            <aside id="detail-panel">
                <div class="panel-header">
                    <button class="action-btn icon-only close-btn" id="btnClosePanel" name="btnClosePanel" type="button" title="Cerrar Panel">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>

                    <button id="btnBack" name="btnBack" type="button" class="btn" style="display:none; margin-bottom:10px; background:none; border:none; color:var(--vinotinto); font-weight:800; font-size:12px; cursor:pointer; display:inline-flex; align-items:center;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg> Volver a Dependencias
                    </button>
                    <h3 class="panel-title" id="panelTitle">...</h3>
                    <p class="panel-subtitle" id="panelSub">Matriz de Inversión</p>

                    <div class="informes-actions">
                        <button class="action-btn text-btn report-btn" id="btnReporteGeneral" name="btnReporteGeneral" type="button" onclick="abrirReporteGeneral()" title="Ver Reporte General" style="display: none;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg>
                            Informe General
                        </button>
                        <button id="print-executive-report" name="print-executive-report" type="button" class="action-btn text-btn print-btn" onclick="ejecutarImpresion()" title="Imprimir Reporte Ejecutivo">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                                <rect x="6" y="14" width="12" height="8"></rect>
                            </svg>
                            Informe de Inversión
                        </button>
                    </div>
                </div>
                <div class="panel-body" id="panelBody"></div>
            </aside>
        </section>

        <aside id="ai-chat-sidebar" class="chat-panel">
            <div class="chat-card">
                <div class="chat-header">
                    <div class="assistant-profile">
                        <div class="avatar-circle">IA</div>
                        <div class="assistant-details">
                            <h2>AMAIA</h2>
                            <span>Asistente de Inversión</span>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button id="btnResetChat" name="btnResetChat" type="button" class="btn-chat-action" onclick="resetChat()" title="Reiniciar Chat">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 4v6h-6"></path>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                            </svg>
                        </button>
                        <button id="btnCloseChat" name="btnCloseChat" type="button" class="btn-chat-action" onclick="toggleChat()" title="Cerrar Chat">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="messenger-wrapper"></div>
            </div>
        </aside>

        <button id="ai-chat-btn" name="ai-chat-btn" type="button" onclick="toggleChat()" title="Hablar con AMAIA">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                <circle cx="9" cy="10" r="1"></circle>
                <circle cx="15" cy="10" r="1"></circle>
            </svg>
        </button>
    </div>

    <script src="geo.js"></script>
    <script src="datos_2025.js"></script>
    <script src="script.js"></script>
</body>
</html>
