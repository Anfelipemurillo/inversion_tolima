<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>Monitor Territorial Tolima 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23761C33' stroke='%23CBA135' stroke-width='2'/%3E%3Cpath d='M16 6c-3.3 0-6 2.7-6 6 0 4.5 6 12 6 12s6-7.5 6-12c0-3.3-2.7-6-6-6zm0 8.5c-1.4 0-2.5-1.1-2.5-2.5s1.1-2.5 2.5-2.5 2.5 1.1 2.5 2.5-1.1 2.5-2.5 2.5z' fill='%23CBA135'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- Módulo de IA (AMAIA) - Dialogflow Messenger temporalmente deshabilitado
    <link rel="stylesheet"
        href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
    <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
    -->
    <link rel="stylesheet" href="../style.css?v=20261120b">
</head>

<body>
    <div id="bgLayer"></div>
    <div id="loader">
        <div class="spinner"></div>
        <div id="loadingText" style="margin-top:15px;">Iniciando Sistema...</div>
    </div>
    <div id="printContainer"></div>

    <div class="main-layout">
        <section class="dashboard-panel">
            <div id="map"></div>

            <aside id="sidebar">
                <!-- Barra de Navegación / Retorno a Inicio -->
                <div class="sidebar-top-bar">
                    <a href="../index.html" class="btn-home-return" title="Volver al Portal Principal de Monitores">
                        <svg class="arrow-icon" width="13" height="13" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span>Inicio</span>
                    </a>
                    <span class="portal-badge-label">Portal de Monitores</span>
                </div>

                <div class="brand-header">
                    <a href="../index.html" title="Volver al Portal Principal">
                        <img id="mainLogo" src="https://tolima.gov.co/images/Tablero_planeacion_2026.jpg"
                            alt="Tolima Logo">
                    </a>
                </div>
                <div class="controls-area">
                    <div class="kpi-card">
                        <div class="kpi-title" id="kpiLabel">Inversión Total Departamental</div>
                        <div class="kpi-value" id="kpiRP">$ 0</div>
                    </div>
                    <fieldset class="filter-group">
                        <legend>
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
                            <span>Vigencia de Inversión</span>
                        </legend>
                        <div class="vigencias-btn-group" id="vigenciasGroup" role="group">
                            <button id="btnVigencia2024" name="btnVigencia2024" type="button" class="btn-vigencia"
                                title="Vigencia 2024 en consolidación" disabled>2024</button>
                            <button id="btnVigencia2025" name="btnVigencia2025" type="button"
                                class="btn-vigencia" onclick="cambiarVigencia('2025')">2025</button>
                            <button id="btnVigencia2026" name="btnVigencia2026" type="button"
                                class="btn-vigencia active" onclick="cambiarVigencia('2026')">2026</button>
                            <button id="btnVigencia2027" name="btnVigencia2027" type="button" class="btn-vigencia"
                                title="Vigencia 2027 próxima a aperturar" disabled>2027</button>
                        </div>
                    </fieldset>
                    <div class="filter-group">
                        <label for="fuenteFilter">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>
                            <span>Fuente de Financiación</span>
                        </label>
                        <select id="fuenteFilter" name="fuenteFilter">
                            <option value="">Todas las Fuentes</option>
                            <option value="propios">Recursos Propios</option>
                            <option value="sgr">Regalías (SGR)</option>
                            <option value="sgp">Participaciones (SGP)</option>
                            <option value="credito">Crédito</option>
                            <option value="cofin">Cofinanciación</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="subFilter">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
                            <span>Filtrar por Subregión</span>
                        </label>
                        <select id="subFilter" name="subFilter">
                            <option value="">Visión Global del Tolima</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="muniFilter">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
                            <span>Seleccionar Municipio</span>
                        </label>
                        <select id="muniFilter" name="muniFilter">
                            <option value="">Todos los Municipios</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="secFilter">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>
                            <span>Filtrar por Dependencia o Entidad</span>
                        </label>
                        <select id="secFilter" name="secFilter">
                            <option value="">Todas las Dependencias o Entidades</option>
                        </select>
                    </div>
                    <div class="map-toggles-container">
                        <button id="btnSubmap" name="btnSubmap" type="button" class="btn-map-toggle">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>
                            </svg>
                            <span>Subregiones</span>
                        </button>
                        <button id="btnHeatmap" name="btnHeatmap" type="button" class="btn-map-toggle">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
                            </svg>
                            <span>Calor</span>
                        </button>
                    </div>
                </div>
            </aside>

            <aside id="detail-panel">
                <div class="panel-header">
                    <button class="action-btn icon-only close-btn" id="btnClosePanel" name="btnClosePanel" type="button"
                        title="Cerrar Panel">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>

                    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px; align-items:center;">
                        <button id="btnBackMuni" name="btnBackMuni" type="button" class="btn"
                            style="display:none; background:none; border:none; color:var(--vinotinto); font-weight:800; font-size:12px; cursor:pointer; align-items:center; gap:4px; padding:0;"
                            title="Volver a la vista departamental general">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg> Volver al Departamento
                        </button>
                        <button id="btnBack" name="btnBack" type="button" class="btn"
                            style="display:none; background:none; border:none; color:var(--vinotinto); font-weight:800; font-size:12px; cursor:pointer; align-items:center; gap:4px; padding:0;"
                            title="Volver al listado de dependencias">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg> Volver a Dependencias
                        </button>
                    </div>
                    <h3 class="panel-title" id="panelTitle">...</h3>
                    <p class="panel-subtitle" id="panelSub">Matriz de Inversión</p>

                    <div class="informes-actions">
                        <button class="action-btn text-btn report-btn" id="btnReporteGeneral" name="btnReporteGeneral"
                            type="button" onclick="abrirReporteGeneral()" title="Ver Reporte General"
                            style="display: none;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg>
                            Informe General
                        </button>
                        <button id="print-executive-report" name="print-executive-report" type="button"
                            class="action-btn text-btn print-btn" onclick="ejecutarImpresion()"
                            title="Imprimir Reporte Ejecutivo">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2">
                                </path>
                                <rect x="6" y="14" width="12" height="8"></rect>
                            </svg>
                            Informe de Inversión
                        </button>
                    </div>
                </div>
                <div class="panel-body" id="panelBody"></div>
            </aside>
        </section>

        <!-- Módulo de IA (AMAIA) - Temporalmente deshabilitado mientras se encuentra en reconfiguración
        <aside id="ai-chat-sidebar" class="chat-panel">
            <div class="chat-card">
                <div class="chat-header">
                    <div class="assistant-profile">
                        <div class="avatar-circle">IA</div>
                        <div class="assistant-details">
                            <h2>AMAIA</h2>
                            <span>Asistente de Inversión</span>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button id="btnResetChat" name="btnResetChat" type="button" class="btn-chat-action"
                            onclick="resetChat()" title="Reiniciar Chat">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 4v6h-6"></path>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                            </svg>
                        </button>
                        <button id="btnCloseChat" name="btnCloseChat" type="button" class="btn-chat-action"
                            onclick="toggleChat()" title="Cerrar Chat">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="messenger-wrapper"></div>
            </div>
        </aside>

        <button id="ai-chat-btn" name="ai-chat-btn" type="button" onclick="toggleChat()" title="Hablar con AMAIA">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                <circle cx="9" cy="10" r="1"></circle>
                <circle cx="15" cy="10" r="1"></circle>
            </svg>
        </button>
        -->
    </div>

    <script src="../geo.js"></script>
    <script src="script.js?v=20261120h"></script>
</body>

</html>
